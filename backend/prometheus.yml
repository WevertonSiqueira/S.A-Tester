# Configuração do Prometheus para coletar métricas da API Flask
# Sistema de Monitoramento Industrial

global:
  scrape_interval: 15s  # Intervalo de coleta de métricas
  evaluation_interval: 15s  # Intervalo de avaliação de regras
  external_labels:
    monitor: 'industrial-monitoring'

# Configuração de alertas (opcional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Regras de alerta (opcional)
rule_files:
  # - 'alerts.yml'

# Configuração de scrape (coleta de métricas)
scrape_configs:
  # Métricas do próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas da API Flask - Sistema de Monitoramento Industrial
  - job_name: 'flask-api'
    scrape_interval: 10s  # Coleta a cada 10 segundos
    metrics_path: '/metrics'  # Caminho das métricas na API
    static_configs:
      - targets: ['localhost:5000']
        labels:
          application: 'industrial-monitoring'
          environment: 'production'
